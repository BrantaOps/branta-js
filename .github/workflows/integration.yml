name: Live integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  guardrail:
    runs-on: ubuntu-latest
    env:
      BRANTA_INTEGRATION_METRICS_TOKEN: ${{ secrets.BRANTA_INTEGRATION_METRICS_TOKEN }}
      # Optional: enables staging usdt_polygon addPayment → verify round-trip.
      BRANTA_API_KEY: ${{ secrets.BRANTA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require integration metrics token
        run: |
          if [ -z "$BRANTA_INTEGRATION_METRICS_TOKEN" ]; then
            echo "Set the BRANTA_INTEGRATION_METRICS_TOKEN Actions secret to the same value as Guardrail."
            exit 1
          fi
      - name: Live Guardrail integration
        run: npm run test:integration
