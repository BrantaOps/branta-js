name: Live integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Example QR codes against staging and production
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js test/v2/integration/exampleQrCodes.test.ts --watchman=false
